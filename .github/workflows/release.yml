name: Release

# On every push to main, Changesets either
# - opens (or updates) a "Version Packages" pull request when there are unreleased changesets: it
#   bumps the versions of every @penline/* package (they share one version) and writes the
#   changelogs; or
# - publishes to npm when there are none left (that pull request was just merged): every package
#   whose version is not on npm yet, with provenance, then pushes a git tag per package.
# "Run workflow" (by hand) does the same from main.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # version commits and release tags
  pull-requests: write # the "Version Packages" pull request
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # CI already ran on the pull request; the build is what gets published.
      - run: pnpm build
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A granular access token with publish rights on @penline (Settings > Secrets > NPM_TOKEN).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
